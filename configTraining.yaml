defaults:
  batch_size: 32
  epochs: 400
  learning_rate: 0.01
  weight_decay: 0.0
  bond_dim: 5
  output_concentration_penalty_weight: 0.25
  tensor_concentration_penalty_weight: 0.25
  post_training_concentration_enabled: true
  post_training_concentration_steps: 200
  post_training_concentration_learning_rate: 0.05
  post_training_concentration_restarts: 4
  patience: 50
  device: auto
  seed: 40

experiments:
  - name: mps_length5_count_ones
    dataset_name: length5_count_ones
  - name: mps_length5_count_zeros
    dataset_name: length5_count_zeros
  - name: mps_length5_adjacent_ones_score
    dataset_name: length5_adjacent_ones_score
